version: '3.8'

services:
  emqx:
    image: emqx/emqx:latest
    container_name: emqx-2
    restart: always
    ports:
      - '1883:1883' # MQTT
      - '8083:8083' # MQTT over WebSocket
      - '8081:8081' # HTTP API
      - '18083:18083' # Dashboard
    environment:
      - EMQX_NAME=emqx
      - EMQX_NODE__NAME=emqx@127.0.0.1
      - EMQX_ALLOW_ANONYMOUS=true
      - EMQX_LISTENER__TCP__EXTERNAL=1883
      - EMQX_DASHBOARD__DEFAULT_USER__PASSWORD=public

      # Enable persistence (Mnesia DB)
      - EMQX_PERSISTENCE__ENABLE=true
      - EMQX_SESSION__EXPIRY_INTERVAL=1d # Keep sessions for 1 day
      - EMQX_MQTT__MAX_INFLIGHT=32
      - EMQX_MQTT__MAX_QUEUED_MESSAGES=1000 # Queue size per client
      - EMQX_MQTT__RETAIN_AVAILABLE=true
      - EMQX_MQTT__QOS0_QUEUE=0 # Do not queue QoS 0
      - EMQX_MQTT__QOS1_QUEUE=1000
      - EMQX_MQTT__QOS2_QUEUE=1000

    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

volumes:
  emqx_data:
  emqx_log:
